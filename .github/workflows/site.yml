# Asks the host to build the site again when a material the site shows changes (_promo/site/README.md
# says which). The host's build hook is the repository secret SITE_BUILD_HOOK; until it is set, the
# job says so and does nothing.
name: site

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "docs/**"
      - "specs/_guidelines/**"
      - "specs/_confirmations.jsonl"
      - "skills/claude-code/README.md"
      - "skills/codex/README.md"
      - "_promo/**"
  workflow_dispatch:

permissions: {}

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the host to build the site
        env:
          HOOK: ${{ secrets.SITE_BUILD_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "SITE_BUILD_HOOK is not set: the site is not rebuilt"
            exit 0
          fi
          curl --fail --silent --show-error --request POST "$HOOK" > /dev/null
          echo "The host was asked to build the site"
