<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The viewer of the specification</title>

  const v = { y: clampY(y) };
  state.views[state.open] = v;
  viewG.setAttribute("transform", `translate(${MARGIN},${v.y})`);
}
(function scrolling() {
  const svg = $("#lower");
  let start = null;
  svg.addEventListener("pointerdown", (e) => { start = { y: e.clientY, top: view()?.y ?? MARGIN }; moved = false; });
  window.addEventListener("pointermove", (e) => {
    if (!start) return;
    const dy = e.clientY - start.y;
    if (!moved && Math.abs(dy) < 4) return;
    moved = true;
    svg.classList.add("dragging");
    state.views[state.open] = { y: start.top + dy };
    applyView();
  });
  window.addEventListener("pointerup", () => { if (start) { start = null; svg.classList.remove("dragging"); persist(); setTimeout(() => { moved = false; }, 0); } });
  svg.addEventListener("wheel", (e) => {
    e.preventDefault();
    const v = view(); if (!v) return;
    state.views[state.open] = { y: v.y - e.deltaY };
    applyView();
    persist();
  }, { passive: false });
  svg.addEventListener("click", (e) => {
    if (moved) return;
    const hit = e.target.closest("[data-act]");
    if (!hit) { if (state.selected) { state.selected = null; refresh(); } return; }
    const { act, sid } = hit.dataset;
    if (act === "expand") state.expanded.add(sid);
    if (act === "collapse") { state.expanded.delete(sid); return refresh(); }
    select(sid);
  });
})();

// ---------------------------------------------------------------- the panel
function nodePanel(sid) {
  const n = nodes[sid];
  return `<div class="md">${VIEWER.markdownHtml(n.markdown, nodes)}</div>`;
}
function partPanel(name) {
  const p = parts.get(name);
  if (!p) return "";
  let h = `<h2>${esc(p.name)}</h2><span class="note">approved ${p.approved} of ${p.all}</span><h3>Files</h3>`;
  h += p.files.map((f) => `<div class="row">${esc(f)}</div>`).join("");
  h += `<h3>At the top</h3>` + topsOf(p).map((s) => `<div class="row"><span class="go" data-sid="${s}">${esc(tailOf(nodes[s]))} ${esc(plain(nodes[s].title))}</span></div>`).join("");
  return h;
}
let panelHtml = null;
function renderPanel() {
  const html = state.selected && nodes[state.selected] ? nodePanel(state.selected) : state.open ? partPanel(state.open) : "";
  if (html === panelHtml) return;
  panelHtml = html;
  patchHtml($("#panel"), html);
}
$("#panel").addEventListener("click", (e) => {
  if (String(getSelection())) return;
  const go = e.target.closest("[data-sid]");
  if (go) navigate(go.dataset.sid);
});
$("#top").addEventListener("click", (e) => {
  const one = e.target.closest("[data-part]");
  if (one && model.views && parts.has(one.dataset.part)) openPart(one.dataset.part);
});

// ---------------------------------------------------------------- actions
function select(sid) { state.selected = sid; refresh(); }
function openPart(name) {
  state.selected = null;
  delete state.views[name];
  state.open = name;
  refresh();
}
/** Selects a node from the panel: opens its part, expands each node above it, and shows the drafts where it is a draft. */
function navigate(sid) {
  const n = nodes[sid];
  if (!n) return;
  state.open = n.part;
  if (!state.showAll && n.status !== "approved") { state.showAll = true; $("#showAll").checked = true; }
  for (const c of chain(sid)) if (c.sid !== sid) state.expanded.add(c.sid);
  state.selected = sid;
  refresh(sid);
}
function refresh(centerOn) {
  drawn = VIEWER.shown(model, state.showAll);
  document.body.classList.toggle("diagram-only", !model.views);
  renderTop();
  if (model.views) { renderLower(centerOn); renderPanel(); renderLegend(); }
  renderFold();
  persist();
}
$("#showAll").addEventListener("change", (e) => { state.showAll = e.target.checked; refresh(); });
window.addEventListener("keydown", (e) => { if (e.key === "Escape") { state.selected = null; refresh(); } });
function renderFold() {
  $("#top").classList.toggle("folded", state.topFolded);
  const btn = $("#foldTop");
  setText(btn, state.topFolded ? "▸" : "▾");
  btn.title = state.topFolded ? "Show the top of the page" : "Fold the top of the page away";
  const p = parts.get(state.open);
  setText($("#foldedName"), p ? `${p.name}  ${p.approved}/${p.all}` : "");
}
const toggleFold = () => { state.topFolded = !state.topFolded; refresh(); };
$("#foldTop").addEventListener("click", toggleFold);
$("#foldedName").addEventListener("click", toggleFold);
function renderLegend() {
  const present = new Set(model.links.map((l) => (VIEWER.TYPES.includes(l.type) ? l.type : "other")));
  const types = [...VIEWER.TYPES.filter((t) => present.has(t)), ...(present.has("other") ? ["other"] : []), "several"];
  patchHtml($("#blockLegend"), types.map((t) => `<span><i style="border-color:${VIEWER.linkColour(t)};${VIEWER.dashed(t) ? "border-top-style:dashed" : ""}"></i>${t === "several" ? "several types" : t === "other" ? "another type" : esc(t)}</span>`).join("") +
    `<span class="break"></span><span>◆ decisions</span><span>✎ comments</span><span>☐ todos</span><span><b style="color:var(--warn)">○</b> a rule linked to no other node</span><span>a dotted border: a draft</span>`);
}
new ResizeObserver(() => { if (model) requestAnimationFrame(drawTopArrows); }).observe($("#domwrap"));
let shownWidth = 0, relayout = null;
new ResizeObserver(() => {
  const width = $("#lowerwrap").clientWidth;
  if (!model || !layout || width === shownWidth) return;
  shownWidth = width;
  clearTimeout(relayout);
  relayout = setTimeout(() => renderLower(), 120);
}).observe($("#lowerwrap"));
(function splitter() {
  const bar = $("#splitter");
  const set = (w) => (w ? document.body.style.setProperty("--panel-w", `${w}px`) : document.body.style.removeProperty("--panel-w"));
  set(state.panelW);
  bar.addEventListener("pointerdown", (e) => {
    try { bar.setPointerCapture(e.pointerId); } catch { /* a pointer the browser will not capture still drags while it stays on the bar */ }
    bar.classList.add("active");
    const move = (ev) => { state.panelW = Math.round(Math.min(Math.max(window.innerWidth - ev.clientX - 3, 260), window.innerWidth - 360)); set(state.panelW); };
    const up = () => { bar.classList.remove("active"); bar.removeEventListener("pointermove", move); bar.removeEventListener("pointerup", up); persist(); };
    bar.addEventListener("pointermove", move);
    bar.addEventListener("pointerup", up);
  });
  bar.addEventListener("dblclick", () => { state.panelW = null; set(null); persist(); });
})();

// ---------------------------------------------------------------- live: redrawn after each change, without a reload
async function load(info) {
  try {
    const res = await fetch("/model.json", { cache: "no-store" });
    const text = await res.text();
    const next = text === modelText ? null : JSON.parse(text);
    if (next) { modelText = text; modelVersion += 1; model = next; index(); $("#showAll").checked = state.showAll; refresh(); }
    const stamp = $("#stamp");
    // A page opened, reloaded or reconnected without an event asks the server whether its last reading failed.
    const err = info ? info.error : (await (await fetch("/status", { cache: "no-store" })).json()).error;
    setText(stamp, err ? `the specification could not be read, so the page shows what was read before: ${err}` : `updated ${new Date(model.built).toLocaleTimeString("en-GB")}`);
    stamp.classList.toggle("bad", !!err);
  } catch (error) {
    $("#stamp").textContent = `no connection to sheriff view: ${error.message}`;
    $("#stamp").classList.add("bad");
  }
}
const events = new EventSource("/events");
events.addEventListener("model", (e) => load(JSON.parse(e.data)));
events.addEventListener("page", () => location.reload());
events.addEventListener("open", () => load());
events.addEventListener("error", () => { $("#stamp").textContent = "no connection to sheriff view, reconnecting…"; $("#stamp").classList.add("bad"); });
load();
</script>
</body>
</html>
